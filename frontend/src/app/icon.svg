<svg xmlns="http://www.w3.org/2000/svg" viewBox="100 100 300 300">
  <defs>
    <clipPath id="topClip">
      <rect x="30" y="-25" width="130" height="23" />
    </clipPath>
    <path id="blade" d="M 40,0 A 4,4 0 0 1 43,-3 Q 95,-22 147,-3 A 4,4 0 0 1 150,0 A 4,4 0 0 1 147,3 Q 95,22 43,3 A 4,4 0 0 1 40,0 Z" />
    <linearGradient id="specular" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="15%"  stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="35%"  stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="50%"  stop-color="#666666" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="glassFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0a0a0a" stop-opacity="0.9" />
      <stop offset="30%"  stop-color="#151515" stop-opacity="0.8" />
      <stop offset="70%"  stop-color="#080808" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#111111" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="innerLight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0" />
      <stop offset="40%"  stop-color="#777777" stop-opacity="0.08" />
      <stop offset="60%"  stop-color="#222222" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>
  <g transform="translate(250,250)">
    <g transform="rotate(0)">
      <use href="#blade" fill="url(#glassFill)" />
      <use href="#blade" fill="url(#innerLight)" />
      <use href="#blade" fill="url(#specular)" clip-path="url(#topClip)" />
      <use href="#blade" fill="none" stroke="url(#glassBorder)" stroke-width="0.8" />
    </g>
    <g transform="rotate(30)">
      <use href="#blade" fill="url(#glassFill)" />
      <use href="#blade" fill="url(#innerLight)" />
      <use href="#blade" fill="url(#specular)" clip-path="url(#topClip)" />
      <use href="#blade" fill="none" stroke="url(#glassBorder)" stroke-width="0.8" />
